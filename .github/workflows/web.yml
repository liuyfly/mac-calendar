name: Web app

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Sources/CalendarCore/Resources/holidays.json'
      - 'scripts/build_web.sh'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'Sources/CalendarCore/Resources/holidays.json'
      - 'scripts/build_web.sh'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every date in the core is a calendar day rather than an instant, so
      # the results must not depend on the runner's zone. Auckland and New
      # York bracket China from both sides, as in the native CI.
      - name: Test
        run: |
          set -euo pipefail
          for zone in UTC Asia/Shanghai America/New_York Pacific/Auckland; do
            echo "::group::TZ=$zone"
            TZ="$zone" node --test 'web/tests/*.test.js'
            echo "::endgroup::"
          done

      - name: Build
        run: WEB_VERSION="$(git rev-parse --short HEAD)" ./scripts/build_web.sh

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  # Needs Settings → Pages → Source set to "GitHub Actions".
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
