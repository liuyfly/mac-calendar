name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      - name: Build
        run: swift build

      # Not `swift test`: XCTest and swift-testing ship with full Xcode, and the
      # suite is written to run without them so it also works on a machine that
      # only has the Command Line Tools. See scripts/run_tests.sh.
      #
      # Run under several time zones. Every date here is anchored to a calendar
      # day rather than an instant, and a conversion that only holds in CST
      # would otherwise pass locally and fail for users elsewhere. The runner
      # itself is UTC, so a CST-only assumption fails here rather than in the
      # field. Auckland and New York bracket China from both sides.
      - name: Test
        run: |
          set -euo pipefail
          for zone in UTC Asia/Shanghai America/New_York Pacific/Auckland; do
            echo "::group::TZ=$zone"
            TZ="$zone" ./scripts/run_tests.sh
            echo "::endgroup::"
          done

      - name: Package app
        run: ./scripts/build_app.sh

      - name: Verify the bundle
        run: |
          set -euo pipefail
          APP=dist/MenuBarCalendar.app
          lipo -info "$APP/Contents/MacOS/MenuBarCalendar"
          lipo -info "$APP/Contents/MacOS/MenuBarCalendar" | grep -q x86_64
          lipo -info "$APP/Contents/MacOS/MenuBarCalendar" | grep -q arm64
          test -f "$APP/Contents/Resources/holidays.json"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist" | grep -q true
          codesign --verify --verbose "$APP"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MenuBarCalendar-app
          path: dist/MenuBarCalendar.app
          if-no-files-found: error
